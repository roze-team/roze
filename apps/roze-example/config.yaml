name: user-api
profile: development
logging:
  enabled: true
  level: info
  format: text
  stdout: true
  ansi: true
  target: true
rest:
  addr: 127.0.0.1:3000
  register: false
registry:
  kind: memory
  endpoints: []
  # prefix: /roze/services
  # ttl_seconds: 10
  # renew_interval_secs: 3
  # user: roze
  # pass: change-me
  # ca_cert_file: certs/etcd-ca.pem
  # cert_file: certs/etcd-client.pem
  # cert_key_file: certs/etcd-client.key
  # insecure_skip_verify: false
governance:
  timeout_ms: 5000
  rate_limit:
    burst: 100
    refill_ms: 10
  breaker:
    failure_threshold: 5
    reset_timeout_ms: 30000
  routes: {}
