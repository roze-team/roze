name: roze-gateway
auth:
  jwt_keys:
    - id: "2026-07"
      secret: change-me
  jwt_active_key_id: "2026-07"
  jwt_issuer: roze-gateway
  jwt_audience: roze-services
  jwt_expiration_secs: 7200
  jwt_clock_skew_secs: 30

gateway:
  listen: "127.0.0.1:8081"
  # Forwarded client addresses are trusted only from these TCP peers.
  trusted_proxy_cidrs: []
  middlewares:
    - trace
  timeout_ms: 8000
  stream_idle_timeout_ms: 60000
  max_stream_connections: 1000
  request_body_limit_bytes: 1048576
  services:
    - name: user
      upstream: "http://127.0.0.1:3000"
      # For private WSS/HTTPS upstreams, enable strict per-service mTLS:
      # tls:
      #   ca_files: ["certs/internal-ca.pem"]
      #   client_cert_file: "certs/gateway-client.pem"
      #   client_key_file: "certs/gateway-client.key"
      #   server_name: "user.internal"
      outlier:
        failure_threshold: 3
        ejection_ms: 30000
      health_check:
        path: /healthz
        interval_ms: 10000
        timeout_ms: 1000
        unhealthy_threshold: 3
        healthy_threshold: 1
        expected_status: 200
  routes:
    - path: /healthz
      service: user
      methods:
        - GET
      rewrite: /
      middlewares:
        - trace
    - path: /user
      service: user
      methods:
        - GET
        - POST
        - PUT
        - DELETE
      rewrite: /user
      retries: 2
      retry_backoff_ms: 100
      middlewares:
        - trace
        - rate
        - breaker
        - auth
      rate_limit:
        burst: 20
        refill_ms: 200
        key:
          dimensions:
            - route
            - client_ip
          headers: []
          missing: reject
      breaker:
        failure_threshold: 5
        reset_timeout_ms: 5000
    - path: /metrics
      service: user
      methods:
        - GET
      rewrite: /metrics
  fallback:
    status: 503
    body:
      code: 503
      message: gateway fallback
    headers:
      content-type: application/json
  cors:
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - authorization
      - content-type
      - x-request-id
      - x-trace-id

governance:
  rate_limiter:
    store: auto
    # Explicit redis_url overrides cache.url; production refuses memory fallback.
    # redis_url: env://REDIS_URL
    key_prefix: roze:rate-limit:v1
    # namespace defaults to the service profile.
    timeout_ms: 100
    unavailable_policy: fail-closed
