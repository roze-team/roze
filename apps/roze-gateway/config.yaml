name: roze-gateway
auth:
  jwt_secret: change-me
  jwt_issuer: roze-gateway
  jwt_expiration_secs: 7200

gateway:
  listen: "127.0.0.1:8081"
  middlewares:
    - trace
  timeout_ms: 8000
  request_body_limit_bytes: 1048576
  services:
    - name: user
      upstream: "http://127.0.0.1:3000"
      outlier:
        failure_threshold: 3
        ejection_ms: 30000
      health_check:
        path: /healthz
        interval_ms: 10000
        timeout_ms: 1000
        unhealthy_threshold: 3
        healthy_threshold: 1
        expected_status: 200
  routes:
    - path: /healthz
      service: user
      methods:
        - GET
      rewrite: /
      middlewares:
        - trace
    - path: /user
      service: user
      methods:
        - GET
        - POST
        - PUT
        - DELETE
      rewrite: /user
      retries: 2
      retry_backoff_ms: 100
      middlewares:
        - trace
        - rate
        - breaker
        - auth
      rate_limit:
        burst: 20
        refill_ms: 200
      breaker:
        failure_threshold: 5
        reset_timeout_ms: 5000
    - path: /metrics
      service: user
      methods:
        - GET
      rewrite: /metrics
  fallback:
    status: 503
    body:
      code: 503
      message: gateway fallback
    headers:
      content-type: application/json
  cors:
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - authorization
      - content-type
      - x-request-id
      - x-trace-id
