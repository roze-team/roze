name: roze-sample
rest:
  addr: 127.0.0.1:3000
  register: false
registry:
  kind: memory
  endpoints: []
  # ttl_seconds: 10
  # renew_interval_secs: 3
governance:
  timeout_ms: 5000
  rate_limit:
    burst: 100
    refill_ms: 10
  breaker:
    failure_threshold: 5
    reset_timeout_ms: 30000
  routes: {}
