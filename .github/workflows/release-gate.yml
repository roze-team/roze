name: release-gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "crates/**"
      - "apps/**"
      - "example/**"
      - "scripts/**"
      - "docs/release.md"
      - "docs/maturity.md"
      - "docs/production-evidence.md"
      - "docs/stability-commitment.md"
      - "docs/roadmap.md"
      - "docs/contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-gate.yml"
      - ".github/workflows/production-soak.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "example/**"
      - "scripts/**"
      - "docs/release.md"
      - "docs/maturity.md"
      - "docs/production-evidence.md"
      - "docs/stability-commitment.md"
      - "docs/roadmap.md"
      - "docs/contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-gate.yml"
      - ".github/workflows/production-soak.yml"

jobs:
  supply-chain:
    name: dependency security and licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit RustSec advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check dependency licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  release-gate:
    name: release stability gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Release gate
        run: bash scripts/release-gate.sh

      - name: Archive S6 production release audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roze-production-release-audit-${{ github.sha }}
          path: target/production-release-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Require strict S6 evidence for release tags
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/production-release-audit.sh --require-long-run

  reference-systems:
    name: production reference systems
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate reference-system environment
        run: bash scripts/reference-systems-preflight.sh

      - name: Run real dependency success, failure, and recovery workflows
        run: bash scripts/reference-systems-integration.sh

      - name: Verify reference-system evidence bundle
        if: always()
        run: |
          if [ -f target/reference-systems-integration/run.json ]; then
            node scripts/reference-systems-evidence-verify.js target/reference-systems-integration
          else
            echo "reference-system run.json was not produced (preflight failure)"
          fi

      - name: Archive reference-system integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roze-reference-systems-${{ github.sha }}
          path: target/reference-systems-integration
          if-no-files-found: warn
          retention-days: 30
