name: rozectl

on:
  push:
    paths:
      - "apps/rozectl/**"
      - "crates/roze-grpc/**"
      - "crates/roze-sqlx/**"
      - "crates/roze-orm/**"
      - "crates/roze-migration/**"
      - "docs/model-ent-parity.md"
      - "docs/contracts/model-*.md"
      - "docs/contracts/generator-extensions.md"
      - "scripts/model-parity-gate.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rozectl.yml"
  pull_request:
    paths:
      - "apps/rozectl/**"
      - "crates/roze-grpc/**"
      - "crates/roze-sqlx/**"
      - "crates/roze-orm/**"
      - "crates/roze-migration/**"
      - "docs/model-ent-parity.md"
      - "docs/contracts/model-*.md"
      - "docs/contracts/generator-extensions.md"
      - "scripts/model-parity-gate.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rozectl.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt --check
        run: rustfmt --edition 2021 --check apps/rozectl/src/main.rs apps/rozectl/src/generator/mod.rs apps/rozectl/src/generator/model.rs

      - name: cargo clippy
        run: cargo clippy --manifest-path apps/rozectl/Cargo.toml -p rozectl --all-targets -- -D warnings

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (sqlite + local)
        run: cargo test -p rozectl -- --skip postgres --skip mysql

      - name: cargo check
        run: cargo check -p rozectl

      - name: model parity gate (SQLite + generated crates)
        run: bash scripts/model-parity-gate.sh local

      - name: Upload SQLite parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-parity-sqlite-evidence
          path: target/model-parity-evidence/sqlite.json
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ROZECTL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: PostgreSQL model parity gate
        run: bash scripts/model-parity-gate.sh postgres

      - name: Upload PostgreSQL parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-parity-postgres-evidence
          path: target/model-parity-evidence/postgres.json
          if-no-files-found: error

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: roze
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ROZECTL_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/roze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: MySQL model parity gate
        run: bash scripts/model-parity-gate.sh mysql

      - name: Upload MySQL parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-parity-mysql-evidence
          path: target/model-parity-evidence/mysql.json
          if-no-files-found: error

  model-parity-release-gate:
    if: always()
    needs: [lint, sqlite, postgres, mysql]
    runs-on: ubuntu-latest
    steps:
      - name: Download model parity evidence
        uses: actions/download-artifact@v4
        with:
          pattern: model-parity-*-evidence
          path: model-parity-evidence
          merge-multiple: true

      - name: Require all model parity evidence
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SQLITE_RESULT: ${{ needs.sqlite.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          MYSQL_RESULT: ${{ needs.mysql.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$SQLITE_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$MYSQL_RESULT" = success
          test -s model-parity-evidence/sqlite.json
          test -s model-parity-evidence/postgres.json
          test -s model-parity-evidence/mysql.json
          grep -F '"backend":"sqlite","status":"passed"' model-parity-evidence/sqlite.json
          grep -F '"backend":"postgres","status":"passed"' model-parity-evidence/postgres.json
          grep -F '"backend":"mysql","status":"passed"' model-parity-evidence/mysql.json
          grep -F "\"revision\":\"$GITHUB_SHA\"" model-parity-evidence/sqlite.json
          grep -F "\"revision\":\"$GITHUB_SHA\"" model-parity-evidence/postgres.json
          grep -F "\"revision\":\"$GITHUB_SHA\"" model-parity-evidence/mysql.json
