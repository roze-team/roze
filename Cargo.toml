[workspace]
members = [
    "crates/roze-context",
    "crates/roze-ai",
    "crates/roze-trace",
    "crates/roze-core",
    "crates/roze-error",
    "crates/roze-result",
    "crates/roze-codec",
    "crates/roze-http",
    "crates/roze-metrics",
    "crates/roze-resilience",
    "crates/roze-rate-limit",
    "crates/roze-middleware",
    "crates/roze-utils",
    "crates/roze-grpc",
    "crates/roze-service",
    "crates/roze-bootstrap",
    "crates/roze-shutdown",
    "crates/roze-health",
    "crates/roze-admin",
    "crates/roze-validation",
    "crates/roze-config",
    "crates/roze-log",
    "crates/roze-prometheus",
    "crates/roze-opentelemetry",
    "crates/roze-profiling",
    "crates/roze-auth",
    "crates/roze-db",
    "crates/roze-mongo",
    "crates/roze-search",
    "crates/roze-query",
    "crates/roze-report",
    "crates/roze-storage",
    "crates/roze-orm",
    "crates/roze-sqlx",
    "crates/roze-transaction",
    "crates/roze-transaction-sql",
    "crates/roze-dtm",
    "crates/roze-migration",
    "crates/roze-cache",
    "crates/roze-redis",
    "crates/roze-local-cache",
    "crates/roze-singleflight",
    "crates/roze-openapi",
    "crates/roze-mq",
    "crates/roze-kafka",
    "crates/roze-gateway",
    "crates/roze-nats",
    "crates/roze-eventbus",
    "crates/roze-job",
    "crates/roze-jwt",
    "crates/roze-session",
    "crates/roze-permission",
    "crates/roze-swagger",
    "crates/roze-cron",
    "crates/roze-worker",
    "crates/roze-ws",
    "crates/roze-push",
    "crates/roze-session-hub",
    "crates/roze-rpc",
    "apps/rozectl",
    "apps/roze-example",
    "apps/roze-sample",
    "apps/user",
    "apps/roze-gateway",
    "apps/roze-dtm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.0.0"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
arc-swap = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15.24", default-features = false, features = ["json", "yaml", "toml"] }
criterion = { version = "0.5", features = ["async_tokio"] }
dashmap = "6"
prost = "0.14"
protoc-bin-vendored = "3"
roze-grpc = { path = "crates/roze-grpc" }
roze-search = { path = "crates/roze-search" }
roze-orm = { path = "crates/roze-orm" }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
ipnet = "2"
rust_xlsxwriter = "0.96"
sea-orm = { version = "1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-rust_decimal", "with-chrono"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "mysql"] }
toasty = { version = "0.7", default-features = false, features = ["postgresql", "mysql", "serde", "rust_decimal"] }
rust_decimal = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2.0.18"
validator = { version = "0.20", features = ["derive"] }
base64 = "0.23"
sha1 = "0.11"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
mongodb = "3.7.0"
moka = { version = "0.12", features = ["future"] }
redis = { version = "1.4.1", features = ["aio", "tokio-comp", "tokio-rustls-comp", "cluster-async"] }
regex = "1"
rskafka = { version = "0.6.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-rustls = "0.26"
webpki-roots = "1"
rcgen = "0.13"
tempfile = "3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
matchit = "=0.9.2"
percent-encoding = "2.3"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["server", "ring"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen"] }
tonic-build = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "decompression-gzip", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25.12"
futures-util = "0.3"
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v7"] }
