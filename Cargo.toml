[workspace]
members = [
    "crates/roze-context",
    "crates/roze-trace",
    "crates/roze-core",
    "crates/roze-error",
    "crates/roze-result",
    "crates/roze-codec",
    "crates/roze-http",
    "crates/roze-metrics",
    "crates/roze-middleware",
    "crates/roze-utils",
    "crates/roze-grpc",
    "crates/roze-service",
    "crates/roze-bootstrap",
    "crates/roze-shutdown",
    "crates/roze-health",
    "crates/roze-validation",
    "crates/roze-config",
    "crates/roze-log",
    "crates/roze-prometheus",
    "crates/roze-opentelemetry",
    "crates/roze-profiling",
    "crates/roze-auth",
    "crates/roze-db",
    "crates/roze-mongo",
    "crates/roze-storage",
    "crates/roze-orm",
    "crates/roze-sqlx",
    "crates/roze-transaction",
    "crates/roze-dtm",
    "crates/roze-migration",
    "crates/roze-cache",
    "crates/roze-redis",
    "crates/roze-local-cache",
    "crates/roze-singleflight",
    "crates/roze-openapi",
    "crates/roze-mq",
    "crates/roze-kafka",
    "crates/roze-gateway",
    "crates/roze-nats",
    "crates/roze-eventbus",
    "crates/roze-job",
    "crates/roze-jwt",
    "crates/roze-session",
    "crates/roze-permission",
    "crates/roze-swagger",
    "crates/roze-cron",
    "crates/roze-worker",
    "crates/roze-ws",
    "crates/roze-push",
    "crates/roze-session-hub",
    "crates/roze-rpc",
    "apps/rozectl",
    "apps/roze-example",
    "apps/roze-sample",
    "apps/user",
    "apps/roze-gateway",
    "apps/roze-dtm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "http2", "json", "query", "tokio", "tracing"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15.24", default-features = false, features = ["json", "yaml", "toml"] }
prost = "0.14"
protoc-bin-vendored = "3"
roze-grpc = { path = "crates/roze-grpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "mysql"] }
toasty = { version = "0.7", default-features = false, features = ["postgresql", "mysql", "serde"] }
thiserror = "2.0.18"
validator = { version = "0.20", features = ["derive"] }
base64 = "0.22"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
mongodb = "3.7.0"
redis = { version = "0.27", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "decompression-gzip", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25.12"
futures-util = "0.3"
uuid = { version = "1", features = ["v7"] }
