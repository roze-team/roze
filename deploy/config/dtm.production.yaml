name: roze-dtm
profile: production

logging:
  enabled: true
  level: info
  env_filter: "info,hyper=warn"
  format: json
  stdout: true
  ansi: false
  target: true
  caller: false
  thread_ids: false
  span_events: none
  utc_time: true
  non_blocking_buffer: 8192
  lossy: true

rest:
  addr: 0.0.0.0:8090
  register: false

governance: {}

application:
  dtm:
    store:
      kind: sqlite
      database_url: env://ROZE_DTM_DATABASE_URL
    max_attempts: 5
    retry_backoff_ms: 1000
    max_retry_backoff_ms: 30000
    branch_call_timeout_ms: 5000
    transaction_timeout_ms: 60000
