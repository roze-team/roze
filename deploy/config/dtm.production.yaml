name: roze-dtm
profile: production

logging:
  enabled: true
  level: info
  env_filter: "info,hyper=warn"
  format: json
  stdout: true
  ansi: false
  target: true
  caller: false
  thread_ids: false
  span_events: none
  utc_time: true
  non_blocking_buffer: 8192
  lossy: true
  # Enable a dedicated durable sink for DTM control and recovery audit events:
  # audit:
  #   non_blocking_buffer: 4096
  #   file:
  #     directory: /var/log/roze/audit
  #     file_name_pattern: "roze-dtm-audit.{date}.jsonl"
  #     rotation: daily
  #     date_format: "%Y-%m-%d"
  #     max_file_size_bytes: 104857600
  #     compression: gzip
  #     compression_level: 6
  #     retention_days: 180
  #     maintenance_interval_secs: 3600

rest:
  addr: 0.0.0.0:8090
  register: false

governance: {}

application:
  dtm:
    control_token: env://ROZE_DTM_CONTROL_TOKEN
    recover_interval_ms: 1000
    recovery_lease_ttl_ms: 5000
    worker_id: env://ROZE_DTM_WORKER_ID
    store:
      kind: sqlite
      database_url: env://ROZE_DTM_DATABASE_URL
    max_attempts: 5
    retry_backoff_ms: 1000
    max_retry_backoff_ms: 30000
    branch_call_timeout_ms: 5000
    transaction_timeout_ms: 60000
