groups:
  - name: roze-gateway-recording
    interval: 30s
    rules:
      - record: roze_gateway:route_requests:rate5m
        expr: |
          sum by (service, route, method, status, outcome) (
            rate(roze_gateway_route_requests_total[5m])
          )

      - record: roze_gateway:route_requests:rate1h
        expr: |
          sum by (service, route, method, status, outcome) (
            rate(roze_gateway_route_requests_total[1h])
          )

      - record: roze_gateway:route_error_ratio:rate5m
        expr: |
          sum by (service, route) (
            rate(roze_gateway_route_requests_total{status=~"5.."}[5m])
          )
          /
          clamp_min(
            sum by (service, route) (
              rate(roze_gateway_route_requests_total[5m])
            ),
            1
          )

      - record: roze_gateway:route_error_ratio:rate1h
        expr: |
          sum by (service, route) (
            rate(roze_gateway_route_requests_total{status=~"5.."}[1h])
          )
          /
          clamp_min(
            sum by (service, route) (
              rate(roze_gateway_route_requests_total[1h])
            ),
            1
          )

      - record: roze_gateway:route_retries:rate5m
        expr: |
          sum by (service, route, reason) (
            rate(roze_gateway_route_retries_total[5m])
          )

      - record: roze_gateway:upstream_events:rate5m
        expr: |
          sum by (service, upstream, outcome) (
            rate(roze_gateway_upstream_events_total[5m])
          )

      - record: roze_gateway:stream_connection_events:rate5m
        expr: |
          sum by (service, route, protocol, outcome) (
            rate(roze_gateway_stream_connection_events_total[5m])
          )

      - record: roze_gateway:stream_connection_rejects:increase5m
        expr: |
          sum by (service, route, protocol) (
            increase(roze_gateway_stream_connection_events_total{outcome="rejected"}[5m])
          )

